# One cached tool environment; each stage calls its package.json command.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/MolCrafts/molcrafts-ci
    rev: c9356be0d8b47d5a22a0708131d1456db33dee0f
    hooks:
      - id: molci-commit
        name: MolVis commit checks
        entry: npm run check:commit
      - id: molci-push
        name: MolVis build checks
        entry: npm run check:push
