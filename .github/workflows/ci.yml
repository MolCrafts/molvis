name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Biome lint & format check
        run: npx biome check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Package types come from dist via exports; build engines first.
      - name: Typecheck (core / page / vsc-ext)
        run: npm run typecheck

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Only core/ may import @molcrafts/molrs
        run: npm run check:molrs-gateway

      # Every workspace shares the monorepo version, and every
      # @molcrafts/molvis-* pin tracks it. A stale pin publishes an
      # umbrella that cannot install.
      - name: Workspace versions and pins are in sync
        run: npm run check:versions

  # These run in headless chromium via @rstest/browser — browser-mode unit
  # tests, not e2e. Previously only `core` ran here, so stage's 881 tests and
  # every sketch/page test were ungated.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, stage, sketch, page]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test ${{ matrix.package }}
        run: npm run test:${{ matrix.package }}

  test-vsc-ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run test:vsc-ext

  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test python
        env:
          # These tests are in-process (wire, RPC, transport). They do not
          # need the page bundle, and a clean checkout has no node_modules
          # so setup.py's "stale bundle → npm run build:page" path dies on
          # `wireit: not found`.
          MOLVIS_SKIP_UI_BUILD: "1"
        run: uv run --extra dev python -m pytest tests

  build-core:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # wireit builds core first; asking for stage is enough.
      - name: Build stage
        run: npm run build:stage

      # Pack gate: ban inspector/gui-editor/loaders in dist and enforce the
      # CDN elements size budget. Catches the 0.0.11 multi-MB debug-UI leak.
      - name: Check pack surface
        run: npm run check:pack

      # Every regressions/*.ts is a hard-golden lock on a shipped spec's
      # public surface (dist deep imports, no third-party runtime). Unwired
      # until 2026-08-16 — they only ever ran by hand.
      - name: Run regression examples
        run: npm run check:regressions

  build-page:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build page
        run: npm run build:page

  build-vsc-ext:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build vsc-ext
        run: npm run build:vsc-ext
