[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setup"
backend-path = ["."]

[project]
name = "molcrafts-molvis"
version = "0.4.0"
description = "Molecular visualization driven by a local WebSocket-hosted page"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "MolCrafts Team" }
]
keywords = ["molecular", "visualization", "jupyter", "chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "molcrafts-molpy>=0.20.1",
    # `molvis serve` runs cells through the same InteractiveShell.run_cell
    # a notebook kernel uses. The shell is the session; there is no second one.
    "ipython>=8",
    "numpy",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "hatchling",
    "pytest>=7.0",
    # test_mdx.py drives the molvis fence through Python-Markdown directly
    # (at docs-build time zensical brings these along).
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
]
video = [
    "imageio-ffmpeg>=0.6",
]
# Headless rendering (Stage.snapshot / Sketch exports / `molvis stage --output`
# with no display): molvis loads its own page in headless Chromium. After
# installing, fetch the browser once: `python -m playwright install chromium`.
headless = [
    "playwright>=1.40",
]
docs = [
    "zensical>=0.0.53",
    "molcrafts-zensical-theme>=0.2.5",
]

[project.scripts]
molvis = "molvis.cli:main"

[project.urls]
Homepage = "https://github.com/molcrafts/molvis"
Repository = "https://github.com/molcrafts/molvis"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built page bundles inside the wheel — WebSocketTransport hosts them
# when no external `page_url` is given: `dist/` is the stage page, and
# `sketch_dist/` the sketch page `mv.Sketch` serves. Both directories are
# gitignored build output, so MANIFEST.in grafts them into the sdist too.
# setup.py refreshes them via `npm run build:page` (which also runs
# `build:sketch-page`) when building from the source tree and a copy is stale;
# see its docstring for the conditions.
[tool.setuptools.package-data]
molvis = ["dist/*", "dist/**/*", "sketch_dist/*", "sketch_dist/**/*"]

# On dev, molvis is built against the folded molpy package in the sibling
# molpy checkout. MolCrafts/molrs is retired.
# The path is relative to this file. CI checks out the same unified layout
# at MOLPY_REF from .github/partners.env. pip ignores this table.
# molpy depends on molcrafts-mollog and molcrafts-molcfg from PyPI.
[tool.uv.sources]
molcrafts-molpy = { path = "../../molpy/molpy", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
