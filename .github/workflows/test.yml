name: test

# Hooks own static checks and build/type/package verification. CI owns unit
# tests and docs: build the JS packages once, and build molpy once per OS.
# Fork pushes check workflow policy only; upstream PRs and pushes run the
# suites. A manual dispatch also runs them in a fork.
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its superseded runs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # uv builds molpy's native core through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked
  # The tests import the package, not the page bundle; setup.py would
  # otherwise run `npm run build:page`, which is the pre-push build gate.
  MOLVIS_SKIP_UI_BUILD: "1"

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@c9356be0d8b47d5a22a0708131d1456db33dee0f

  workflows:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@c9356be0d8b47d5a22a0708131d1456db33dee0f

  javascript:
    name: test / javascript
    needs: [context, workflows]
    if: needs.context.outputs.skip-pr != 'true' && (needs.context.outputs.upstream == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-source
      - run: npm run build:packages
      - run: npm run test:js
      - run: npm run test:vsc-ext

  python:
    name: test / python (${{ matrix.os }})
    needs: [context, workflows]
    if: needs.context.outputs.skip-pr != 'true' && (needs.context.outputs.upstream == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@c9356be0d8b47d5a22a0708131d1456db33dee0f
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@c9356be0d8b47d5a22a0708131d1456db33dee0f
      # molpy/rust-toolchain.toml pins the compiler that builds the molpy wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@c9356be0d8b47d5a22a0708131d1456db33dee0f
        with:
          toolchain-dir: ../molpy
          cache: molpy
          workspaces: ../molpy/molpy -> ../target
      - name: Unit tests
        run: uv run --project python --extra dev python -m pytest python/tests
      # The site as Cloudflare Pages builds it, zensical --strict: any warning
      # fails. Cloudflare Pages deploys it, so no job here deploys.
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: uv run --project python --extra docs zensical build --strict

  # The one check branch rules require (molci rulesets): it runs whatever
  # happened before it and fails unless every job succeeded or was skipped.
  result:
    name: test / result
    needs: [context, workflows, javascript, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
