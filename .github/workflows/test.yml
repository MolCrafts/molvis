name: test

# The tests a laptop cannot run: every OS. The local hooks run every
# molcrafts-ci `node-python` gate once (pre-commit: workflows, biome, guards;
# pre-push: build, typecheck, js, vsc-ext, python, docs), so this
# workflow repeats none of the shared static checks, the Node suites or the bundle
# builds; none of them depends on the OS. The Python suite runs once per OS
# against the partners .github/partners.env names, in two tiers (`test /
# context` decides):
#
#   fast  a feature-branch push to MolCrafts: Linux.
#   full  every push to a fork (proven before its pull request), dev, master
#         on MolCrafts, pull requests and dispatches: Linux, macOS
#         and Windows.
#
# The strict docs build runs in the Linux leg, after its tests, in the same
# environment. The Linux leg also runs the pinned Python lint gate before
# compiling dependencies. The molrs imported by docs is the one built and tested, not
# a second compile.
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its superseded runs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # uv builds molpy's native core through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked
  # The tests import the package, not the page bundle; setup.py would
  # otherwise run `npm run build:page`, which is the pre-push build gate.
  MOLVIS_SKIP_UI_BUILD: "1"

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@f5d3606fab87fc162271c94219dbdc5201dd1aab

  python:
    name: test / python (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@f5d3606fab87fc162271c94219dbdc5201dd1aab
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@f5d3606fab87fc162271c94219dbdc5201dd1aab
        if: matrix.os == 'ubuntu-latest'
        with:
          install: "false"
      - name: Python lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:python-lint
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@f5d3606fab87fc162271c94219dbdc5201dd1aab
      # molpy/rust-toolchain.toml pins the compiler that builds the molpy wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@f5d3606fab87fc162271c94219dbdc5201dd1aab
        with:
          toolchain-dir: ../molpy
          cache: molpy
          workspaces: ../molpy/molpy -> ../target
      # The pre-push `python` gate.
      - name: Unit tests
        run: uv run --project python --extra dev python -m pytest python/tests
      # The site as Cloudflare Pages builds it, zensical --strict: any warning
      # fails. Cloudflare Pages deploys it, so no job here deploys.
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: uv run --project python --extra docs zensical build --strict

  # The one check branch rules require (molci rulesets): it runs whatever
  # happened before it and fails unless every job succeeded or was skipped.
  result:
    name: test / result
    needs: [context, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
