name: setup-source
description: Build the pinned MolWASM dependency before installing the MolVis workspace
runs:
  using: composite
  steps:
    - uses: MolCrafts/molcrafts-ci/actions/setup-partners@c9356be0d8b47d5a22a0708131d1456db33dee0f
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@c9356be0d8b47d5a22a0708131d1456db33dee0f
      with:
        toolchain-dir: ../molpy
        cache: molwasm
        workspaces: ../molpy/molwasm -> ../target
    - uses: MolCrafts/molcrafts-ci/actions/setup-wasm@c9356be0d8b47d5a22a0708131d1456db33dee0f
    - name: Build MolWASM, then install the workspace
      shell: bash
      run: |
        npm run build:molwasm
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
