name: "Release: VSCode Extension"

on:
  push:
    tags: ["v*"]
  # Manual trigger for republishing after packaging/marketplace fixes
  # without re-firing the shared release tag (which would re-run the
  # already-published core/python jobs). Mirrors release-core.yml.
  workflow_dispatch:
    inputs:
      skip_marketplace:
        description: "Skip VS Marketplace (version already published there)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-vsc-ext
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build vsc-ext
        run: npm run build:vsc-ext

      - name: Package VSIX
        working-directory: vsc-ext
        run: npx vsce package --no-dependencies -o molvis.vsix

      - name: Publish to VS Marketplace
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_marketplace != true }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: vsc-ext/molvis.vsix
          skipDuplicate: true

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          extensionFile: vsc-ext/molvis.vsix
          skipDuplicate: true
