[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setup"
backend-path = ["."]

[project]
name = "molcrafts-molvis"
version = "0.2.0"
description = "Molecular visualization driven by a local WebSocket-hosted page"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "MolCrafts Team" }
]
keywords = ["molecular", "visualization", "jupyter", "chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # `molvis.FrameStream` needs a molpy whose molrs ships `molrs.stream` —
    # `molrs.io.read_frame_bytes` and `molrs.stream.FrameServer`. 0.12.3 is the
    # first release that carries both.
    "molcrafts-molpy>=0.12.3",
    "numpy",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "hatchling",
    "pytest>=7.0",
    "pytest-cov",
    "imageio-ffmpeg>=0.6",
    "pillow>=10",
    # test_ipython_extension.py and test_scene_smoke.py drive the inline
    # viewer through a live IPython shell; without this the declared dev
    # environment cannot run its own suite (7 collection errors).
    "ipython>=8",
    # test_mdx.py drives the molvis fence through Python-Markdown directly
    # (at docs-build time zensical brings these along).
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
]
video = [
    "imageio-ffmpeg>=0.6",
]
docs = [
    "zensical>=0.0.53",
    "molcrafts-zensical-theme>=0.2.5",
]

[project.scripts]
molvis = "molvis.cli:main"

[project.urls]
Homepage = "https://github.com/molcrafts/molvis"
Repository = "https://github.com/molcrafts/molvis"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built page bundle inside the wheel — it's hosted by
# WebSocketTransport when no external `page_url` is given. The directory is
# gitignored build output, so MANIFEST.in grafts it into the sdist too.
# setup.py refreshes it via `npm run build:page` when building from the
# source tree and the copy is stale; see its docstring for the conditions.
[tool.setuptools.package-data]
molvis = ["dist/*", "dist/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
