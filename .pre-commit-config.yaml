# Shared CI hooks plus MolVis-specific Python lint. The profile name lives in
# .github/partners.env as CI_PROFILE; pin-ci keeps this URL aligned with CI_REF.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: python-lint
        name: Python lint
        entry: npm run check:python-lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ci
        name: molcrafts-ci
        entry: uv run --no-project --script https://raw.githubusercontent.com/MolCrafts/molcrafts-ci/f5d3606fab87fc162271c94219dbdc5201dd1aab/hooks/ci.py
        language: system
        pass_filenames: false
        always_run: true
        # pre-commit only: the pre-push stage runs its own gate list; listing
        # this hook for pre-push too would run the pre-commit checks twice.
        stages: [pre-commit]
        args: ["--stage", "pre-commit"]
      - id: ci-push
        name: molcrafts-ci pre-push
        entry: uv run --no-project --script https://raw.githubusercontent.com/MolCrafts/molcrafts-ci/f5d3606fab87fc162271c94219dbdc5201dd1aab/hooks/ci.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        args: ["--stage", "pre-push"]
