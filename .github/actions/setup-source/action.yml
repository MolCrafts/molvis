name: setup-source
description: Build the pinned MolWASM dependency before installing the MolVis workspace
runs:
  using: composite
  steps:
    - uses: MolCrafts/molcrafts-ci/actions/setup-node@c9356be0d8b47d5a22a0708131d1456db33dee0f
      with:
        install: "false"
    - uses: MolCrafts/molcrafts-ci/actions/setup-partners@c9356be0d8b47d5a22a0708131d1456db33dee0f
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@c9356be0d8b47d5a22a0708131d1456db33dee0f
      with:
        toolchain-dir: ../molpy
        cache: molwasm
        workspaces: ../molpy/molwasm -> ../target
    # setup-wasm auto-enables npm caching and requires a committed lockfile.
    # setup-node supports this workspace's lockfile-free npm install.
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
      with:
        tool: wasm-pack@0.15.0
    - name: Install Binaryen
      shell: bash
      run: |
        set -euo pipefail
        # Build-tool pin, matching molpy master’s shared WASM setup.
        binaryen_version=version_133
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${binaryen_version}/binaryen-${binaryen_version}-x86_64-linux.tar.gz" \
          | sudo tar -xz -C /usr/local --strip-components=1
        wasm-opt --version
    - name: Build MolWASM, then install the workspace
      shell: bash
      run: |
        npm run build:molwasm
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
