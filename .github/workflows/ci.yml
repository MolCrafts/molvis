name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Biome lint & format check
        run: npx biome check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Package types come from dist via exports; build engines first.
      - name: Typecheck (core / page / vsc-ext)
        run: npm run typecheck

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Only core/ may import @molcrafts/molrs
        run: npm run check:molrs-gateway

      # Every workspace shares the monorepo version, and every
      # @molcrafts/molvis-* pin tracks it. A stale pin publishes an
      # umbrella that cannot install.
      - name: Workspace versions and pins are in sync
        run: npm run check:versions

  # Browser-mode unit tests (@rstest/browser). One job, one Chromium —
  # a 6-way matrix each running `playwright install` hung CI on apt.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('node_modules/playwright/package.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser-mode unit tests
        run: npm run test:browser

  test-vsc-ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run test:vsc-ext

  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test python
        env:
          # These tests are in-process (wire, RPC, transport). They do not
          # need the page bundle, and a clean checkout has no node_modules
          # so setup.py's "stale bundle → npm run build:page" path dies on
          # `wireit: not found`.
          MOLVIS_SKIP_UI_BUILD: "1"
        run: uv run --extra dev python -m pytest tests

  build-stage:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build stage library
        run: npm run build:stage

  build-stage-viewer:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build @molcrafts/molvis-stage-viewer
        run: npm run build:stage-viewer

      - name: Check stage-viewer pack surface
        run: npm run check:pack -w @molcrafts/molvis-stage-viewer

  build-sketch-viewer:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build @molcrafts/molvis-sketch-viewer
        run: npm run build:sketch-viewer

      - name: Check sketch-viewer pack surface
        run: npm run check:pack -w @molcrafts/molvis-sketch-viewer

  regressions:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build stage library
        run: npm run build:stage

      - name: Build viewer packages
        run: npm run build:stage-viewer && npm run build:sketch-viewer

      - name: Run regression examples
        run: npm run check:regressions

  build-page:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build page (no viewer package)
        run: npm run build:page

      - name: Page publicPath is document-relative
        run: npm run check:page-public-path

  build-vsc-ext:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build vsc-ext
        run: npm run build:vsc-ext
