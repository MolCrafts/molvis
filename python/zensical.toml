# Python package mini-docs (wheel README companion). Prefer the monorepo root
# `zensical.toml` for the full product manual at docs.molcrafts.org/molvis/.

[project]
site_name = "MolVis"
site_description = "Python API for MolVis molecular visualization"
site_author = "MolCrafts Team"
site_url = "https://docs.molcrafts.org/molvis/interfaces/python/"
repo_url = "https://github.com/molcrafts/molvis"
repo_name = "molcrafts/molvis"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 MolCrafts Team"

nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quickstart.md" },
  { "API Reference" = [
    "api/show.md",
    "api/standalone.md",
    "api/jupyter.md",
    "api/commands.md",
  ]},
  { "Development" = "development.md" },
]

[project.theme]
name = "molcrafts"
language = "en"

[project.extra.molcrafts]
product = "molvis"
accent = "#7c3aed"
accent_soft = "rgba(124, 58, 237, 0.14)"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/molcrafts/molvis"
