name: nightly

# Two artefacts from the same `nightly` branch:
#   1. PyPI `molcrafts-molvis-nightly` (dev version), pinned to
#      `molcrafts-molpy-nightly` so the 0.15 molrs/molpy line is used.
#   2. The page bundle at app.molcrafts.org/nightly/molvis/ (Cloudflare Pages
#      project `molvis`, production-equivalent preview branch `nightly`).
#
# GitHub only schedules the copy of this file on the default branch
# (master). Shared context resolves `dev` once; every job checks out that
# same immutable commit.
'on':
  schedule:
  - cron: 41 2 * * *
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; a nightly run is never cancelled.
# The canonical block: actions/check-workflows.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: nightly
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@01317cbc43f961ab14c35d51d48c081a1acfe815

  prepare:
    name: nightly / prepare
    needs: context
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      changed: ${{ steps.v.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.context.outputs.source-ref }}
    - id: v
      run: |
        set -euo pipefail
        BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n1)
        echo "version=${BASE}.dev$(date -u +%Y%m%d%H%M)" | tee -a "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
          echo "changed=true" | tee -a "$GITHUB_OUTPUT"
        fi
  page:
    concurrency:
      group: nightly-page-publication
      cancel-in-progress: false
    name: nightly / page
    needs:
    - context
    - prepare
    if: needs.context.outputs.nightly == 'true' && (needs.prepare.outputs.changed == 'true')
    runs-on: ubuntu-latest
    # The Cloudflare token and account live in this environment, nowhere else.
    environment: cloudflare-pages-nightly
    permissions:
      contents: read
      deployments: write
    env:
      MOLVIS_ASSET_BASE: /nightly/molvis/
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.context.outputs.source-ref }}
    - uses: MolCrafts/molcrafts-ci/actions/setup-node@01317cbc43f961ab14c35d51d48c081a1acfe815
    - run: npm run build:page
    - run: grep -F 'window.__MOLVIS_ASSET_BASE__="/nightly/molvis/"' page/dist/index.html
    - uses: actions/upload-artifact@v7
      with:
        name: molvis-nightly-page
        path: page/dist
    - uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy page/dist --project-name=molvis --branch=nightly

  python:
    name: nightly / python
    needs: [context, prepare]
    if: needs.context.outputs.nightly == 'true' && (needs.prepare.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi-nightly
      url: https://pypi.org/p/molcrafts-molvis-nightly
    permissions:
      contents: read
      id-token: write
    env:
      MOLVIS_ASSET_BASE: /nightly/molvis/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build page bundle into the Python package
        env:
          MOLVIS_ASSET_BASE: /nightly/molvis/
        run: npm run build:page

      - name: Stamp nightly Python distribution
        env:
          DEV: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python - "$DEV" <<'PY'
          import re, sys, pathlib
          dev = sys.argv[1]
          p = pathlib.Path("python/pyproject.toml")
          t = p.read_text()
          t = re.sub(
              r'^name\s*=\s*"molcrafts-molvis"',
              'name = "molcrafts-molvis-nightly"',
              t,
              count=1,
              flags=re.M,
          )
          t = re.sub(
              r'^version\s*=\s*".*?"',
              f'version = "{dev}"',
              t,
              count=1,
              flags=re.M,
          )
          t = re.sub(
              r'"molcrafts-molpy>=[^"]+"',
              '"molcrafts-molpy-nightly>=0.15.0.dev0"',
              t,
              count=1,
          )
          p.write_text(t)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheel
        working-directory: python
        env:
          MOLVIS_SKIP_UI_BUILD: "1"
        run: pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true
